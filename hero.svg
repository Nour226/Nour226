<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Asmaa Nour El Yakine AMRI</title>
  <desc id="d">Animated ocean hero with swimming fish, bubbles and waves. AI / ML, Data Science, Product Engineering.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#190b2d"/>
      <stop offset="0.55" stop-color="#5b1250"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="fishA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="fishB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbcfe8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="0"/></clipPath>
    <!-- reusable fish: faces right, tail wags -->
    <g id="fish">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-14 4 0;14 4 0;-14 4 0" dur="0.7s" repeatCount="indefinite"/>
        <path d="M4,0 L-30,-20 Q-20,0 -30,20 Z" fill-opacity="0.85"/>
      </g>
      <path d="M0,0 C22,-26 66,-28 96,0 C66,28 22,26 0,0 Z"/>
      <path d="M34,-20 Q50,-40 66,-18 Z" fill-opacity="0.7"/>
      <path d="M40,14 Q50,30 58,14 Z" fill-opacity="0.6"/>
      <circle cx="74" cy="-4" r="5" fill="#fff"/>
      <circle cx="75.5" cy="-4" r="2.4" fill="#190b2d"/>
      <path d="M58,-12 Q54,0 58,12" stroke="#fff" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    </g>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#sea)"/>
    <ellipse cx="900" cy="120" rx="360" ry="170" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- light rays -->
    <g>
      <polygon points="200,0 260,0 150,340 40,340" fill="url(#ray)"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/></polygon>
      <polygon points="520,0 590,0 520,340 400,340" fill="url(#ray)"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="9s" repeatCount="indefinite"/></polygon>
      <polygon points="880,0 940,0 880,340 760,340" fill="url(#ray)"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="8s" repeatCount="indefinite"/></polygon>
      <polygon points="1100,0 1150,0 1100,340 1000,340" fill="url(#ray)"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="10s" repeatCount="indefinite"/></polygon>
    </g>

    <!-- far fish (small, faint) -->
    <g fill="url(#fishB)" opacity="0.35">
      <g><animateTransform attributeName="transform" type="translate" values="-160 70;1360 70" dur="26s" repeatCount="indefinite"/>
        <g transform="scale(0.55)"><use href="#fish"/></g></g>
      <g><animateTransform attributeName="transform" type="translate" values="1360 150;-160 150" dur="32s" begin="-10s" repeatCount="indefinite"/>
        <g transform="scale(-0.5,0.5)"><use href="#fish"/></g></g>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#fbcfe8" stroke-opacity="0.7" stroke-width="1.5">
      <circle cx="90" cy="340" r="5"><animate attributeName="cy" values="350;-10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="340" r="8"><animate attributeName="cy" values="350;-10" dur="11s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="340" r="4"><animate attributeName="cy" values="350;-10" dur="9s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="340" r="6"><animate attributeName="cy" values="350;-10" dur="12s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="340" r="9"><animate attributeName="cy" values="350;-10" dur="10s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="340" r="5"><animate attributeName="cy" values="350;-10" dur="9s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="340" r="7"><animate attributeName="cy" values="350;-10" dur="13s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13s" begin="-6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- main fish (bobbing) -->
    <g fill="url(#fishA)" opacity="0.95">
      <g><animateTransform attributeName="transform" type="translate" values="-180 235;1380 235" dur="18s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0;0 12;0 0" dur="3.5s" repeatCount="indefinite"/>
          <use href="#fish"/></g></g>
    </g>
    <g fill="url(#fishB)" opacity="0.9">
      <g><animateTransform attributeName="transform" type="translate" values="1400 270;-200 270" dur="23s" begin="-8s" repeatCount="indefinite"/>
        <g transform="scale(-0.8,0.8)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0;0 -10;0 0" dur="4s" repeatCount="indefinite"/><use href="#fish"/></g></g></g>
    </g>
    <g fill="url(#fishA)" opacity="0.8">
      <g><animateTransform attributeName="transform" type="translate" values="-160 105;1360 105" dur="30s" begin="-15s" repeatCount="indefinite"/>
        <g transform="scale(0.7)"><use href="#fish"/></g></g>
    </g>

    <!-- title -->
    <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <text x="600" y="150" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="1">
        Asmaa Nour El Yakine AMRI
        <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
        <animate attributeName="y" values="170;150" dur="1.4s" fill="freeze"/>
      </text>
      <text x="600" y="196" font-size="20" fill="#fbcfe8" letter-spacing="4" opacity="0">
        AI / ML  ·  DATA SCIENCE  ·  PRODUCT ENGINEERING
        <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.8s" fill="freeze"/>
      </text>
    </g>

    <!-- waves -->
    <g>
      <g opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="9s" repeatCount="indefinite"/>
        <path d="M0,300 q75,-26 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 V340 H0 Z" fill="#f472b6"/></g>
      <g opacity="0.8"><animateTransform attributeName="transform" type="translate" values="-300 0;0 0" dur="6s" repeatCount="indefinite"/>
        <path d="M0,316 q75,-22 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 V340 H0 Z" fill="#9d174d"/></g>
      <g><animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="4s" repeatCount="indefinite"/>
        <path d="M0,330 q75,-14 150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 t150,0 V340 H0 Z" fill="#190b2d"/></g>
    </g>
  </g>
</svg>
