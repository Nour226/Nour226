
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asmaa Nour | Underwater Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --ocean: #030b14;
  --blue: #05648a;
  --red: #e30402;
  --white: #fbfbfb;
}

body {
  background: var(--ocean);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}

.hero {
  position: relative;
  min-height: 590px;
  height: 92vh;
  max-height: 850px;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 75% 45%, #075174 0%, transparent 45%),
    radial-gradient(ellipse at 15% 75%, #063044 0%, transparent 45%),
    linear-gradient(120deg, #020508, #031b2b 60%, #02070d);
}

/* Underwater lighting */

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    repeating-linear-gradient(
      110deg,
      transparent 0 90px,
      rgba(73, 185, 220, .025) 110px,
      transparent 140px
    ),
    radial-gradient(ellipse at 80% 20%,
      rgba(0, 153, 210, .16), transparent 55%);
  animation: waterLight 9s ease-in-out infinite alternate;
}

@keyframes waterLight {
  from { transform: translateX(-3%) scale(1); }
  to { transform: translateX(3%) scale(1.08); }
}

/* Ocean floor */

.seabed {
  position: absolute;
  bottom: -5px;
  width: 100%;
  height: 145px;
  opacity: .7;
  background:
    radial-gradient(ellipse at 15% 100%, #092e42 0 12%, transparent 35%),
    radial-gradient(ellipse at 55% 110%, #061c2a 0 18%, transparent 42%),
    radial-gradient(ellipse at 90% 100%, #07506a 0 10%, transparent 35%);
  filter: blur(8px);
}

/* Main frame */

.frame {
  position: absolute;
  inset: 7% 5%;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.16);
  backdrop-filter: blur(2px);
  padding: 28px 35px;
}

/* Navigation */

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 5;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  display: block;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 4px;
  text-align: center;
  color: #8daab7;
}

.nav-links {
  display: flex;
  gap: 35px;
  list-style: none;
}

.nav-links a {
  color: #d4e4ec;
  font-size: 11px;
  text-decoration: none;
  transition: .3s;
}

.nav-links a:hover {
  color: #ff3838;
}

.nav-links a::after {
  content: "";
  display: block;
  width: 0;
  height: 2px;
  background: var(--red);
  transition: .3s;
  margin-top: 7px;
}

.nav-links a:hover::after {
  width: 100%;
}

/* Introduction */

.intro {
  position: absolute;
  top: 27%;
  left: 7%;
  z-index: 3;
  max-width: 490px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 7px;
  text-transform: uppercase;
  color: #d1e2eb;
  margin-bottom: 12px;
  animation: fadeUp 1s both;
}

.name {
  font-size: clamp(38px, 5.4vw, 76px);
  font-weight: 900;
  letter-spacing: -4px;
  line-height: .98;
  animation: fadeUp 1.1s .1s both;
}

.name span {
  color: #e30402;
}

.description {
  margin-top: 26px;
  color: #b9cbd5;
  font-size: 13px;
  line-height: 2;
  letter-spacing: 1.2px;
  max-width: 390px;
  animation: fadeUp 1.2s .2s both;
}

.description strong {
  color: white;
  font-weight: 600;
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-top: 27px;
  padding: 13px 22px;
  border: 1px solid rgba(255,255,255,.45);
  color: white;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 2px;
  transition: .3s;
  animation: fadeUp 1.3s .3s both;
}

.cta:hover {
  background: #e30402;
  border-color: #e30402;
  transform: translateY(-3px);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Betta fish */

.fish-container {
  position: absolute;
  width: min(49%, 540px);
  right: 3%;
  top: 19%;
  z-index: 2;
  animation: swim 5s ease-in-out infinite;
  transition: transform .2s ease-out;
  filter: drop-shadow(0 0 35px rgba(220, 15, 25, .25));
}

@keyframes swim {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-18px) rotate(2deg); }
}

.fish-svg {
  width: 100%;
  overflow: visible;
}

.fish-tail {
  transform-origin: 72% 49%;
  animation: tailMove 1.2s ease-in-out infinite alternate;
}

@keyframes tailMove {
  from { transform: rotate(-5deg) scaleX(1); }
  to { transform: rotate(7deg) scaleX(.94); }
}

.fish-fin {
  transform-origin: center;
  animation: finMove 1s ease-in-out infinite alternate;
}

@keyframes finMove {
  from { transform: rotate(-3deg); }
  to { transform: rotate(5deg); }
}

/* Floating bubbles */

.bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.bubble {
  position: absolute;
  bottom: -30px;
  width: var(--size);
  height: var(--size);
  left: var(--left);
  border: 1px solid rgba(170,230,255,.3);
  border-radius: 50%;
  background: rgba(125,210,255,.04);
  animation: rise var(--duration) linear infinite;
  animation-delay: var(--delay);
}

@keyframes rise {
  to {
    transform: translateY(-110vh) translateX(35px);
    opacity: 0;
  }
}

/* Bottom details */

.bottom {
  position: absolute;
  bottom: 25px;
  left: 35px;
  right: 35px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 4;
}

.socials {
  display: flex;
  align-items: center;
  gap: 13px;
  font-size: 11px;
  color: #b8cbd4;
  letter-spacing: 1px;
}

.socials a {
  color: white;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.3);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  transition: .3s;
}

.socials a:hover {
  background: var(--red);
  border-color: var(--red);
}

.scroll {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 38px;
  height: 38px;
  background: white;
  color: #03121e;
  border-radius: 50%;
  display: grid;
  place-items: center;
  text-decoration: none;
  font-size: 20px;
  transition: .3s;
}

.scroll:hover {
  transform: translateX(-50%) translateY(-5px);
}

.signature {
  font-size: 12px;
  letter-spacing: 8px;
  color: #d7e9f0;
}

/* Corner decorations */

.corner {
  position: absolute;
  width: 45px;
  height: 45px;
  border-color: rgba(255,255,255,.55);
  border-style: solid;
  pointer-events: none;
}

.corner.top-left {
  top: 23%;
  left: 3%;
  border-width: 1px 0 0 1px;
}

.corner.bottom-right {
  bottom: 15%;
  right: 4%;
  border-width: 0 1px 1px 0;
}

/* Mobile */

@media(max-width: 700px) {
  .hero {
    min-height: 740px;
    height: 100svh;
    max-height: 900px;
  }

  .frame {
    inset: 12px;
    padding: 22px 17px;
  }

  .nav-links {
    gap: 12px;
  }

  .nav-links a {
    font-size: 9px;
  }

  .intro {
    top: 13%;
    left: 6%;
    right: 6%;
    text-align: center;
    max-width: none;
  }

  .name {
    font-size: clamp(35px, 10vw, 57px);
    letter-spacing: -2px;
  }

  .eyebrow {
    font-size: 9px;
    letter-spacing: 4px;
  }

  .description {
    margin: 15px auto 0;
    font-size: 11px;
    line-height: 1.8;
  }

  .cta {
    margin-top: 15px;
  }

  .fish-container {
    width: 88%;
    max-width: 430px;
    right: 6%;
    top: 48%;
  }

  .bottom {
    bottom: 17px;
    left: 16px;
    right: 16px;
  }

  .signature {
    letter-spacing: 3px;
    font-size: 9px;
  }

  .socials {
    gap: 7px;
    font-size: 9px;
  }

  .socials a {
    width: 24px;
    height: 24px;
  }

  .scroll {
    display: none;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<section class="hero" id="home">

  <div class="seabed"></div>
  <div class="bubbles" id="bubbles"></div>

  <div class="frame">

    <nav>
      <div class="logo">
        AN
        <span>PORTFOLIO</span>
      </div>

      <ul class="nav-links">
        <li><a href="#home">HOME</a></li>
        <li><a href="#about">ABOUT</a></li>
        <li><a href="https://github.com/Nour226">PROJECTS</a></li>
        <li><a href="https://www.linkedin.com/in/amri-asmaa-nour-el-yakine-527866216/">CONTACT</a></li>

    </nav>

    <div class="corner top-left"></div>
    <div class="corner bottom-right"></div>

    <div class="intro">

      <div class="eyebrow">

      </div>

      <h1 class="name">

        <span>AMRI.</span>
      </h1>

      <p class="description">

      <a class="cta"

    <!-- Animated Betta fish illustration -->

    <div class="fish-container" id="fish">

      <svg class="fish-svg" viewBox="0 0 600 450"
           xmlns="http://www.w3.org/2000/svg">

        <defs>
          <radialGradient id="body" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#ff7770"/>
            <stop offset="35%" stop-color="#ef1725"/>
            <stop offset="75%" stop-color="#8d0016"/>
            <stop offset="100%" stop-color="#31000c"/>
          </radialGradient>

          <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff4a42"/>
            <stop offset="50%" stop-color="#e60021"/>
            <stop offset="100%" stop-color="#680016"/>
          </linearGradient>

          <radialGradient id="head">
            <stop offset="0%" stop-color="#ffaaaa"/>
            <stop offset="50%" stop-color="#ec2433"/>
            <stop offset="100%" stop-color="#790018"/>

          <filter id="glow">
            <feGaussianBlur stdDeviation="5"/>
          </filter>
        </defs>

        <!-- Tail -->

        <g class="fish-tail">
          <path d="M370 220
            Q490 40 570 25
            Q545 110 590 165
            Q525 195 590 245
            Q525 315 570 405

          <path d="M375 225 Q490 80 570 25

                   M375 240 Q490 370 570 405"

        <!-- Upper fin -->

        <g class="fish-fin">
          <path d="M210 155

            Q380 130 335 190
            Q270 160 210 155 Z"

          <path d="M220 150 Q280 55 420 65
                   M245 153 Q300 90 400 80
                   M275 160 Q330 115 380 100"

        <!-- Lower fin -->

        <g class="fish-fin">
          <path d="M235 275

        <path d="M105 225

    <div class="bottom">

      <div class="socials">

  </div>
</section>

<script>
// Generate underwater bubbles

const bubbleArea = document.getElementById("bubbles");

for (let i = 0; i < 32; i++) {
  const bubble = document.createElement("span");
  bubble.className = "bubble";

  bubble.style.setProperty("--size",
    (Math.random() * 9 + 3) + "px");

  bubble.style.setProperty("--left",
    Math.random() * 100 + "%");

  bubble.style.setProperty("--duration",
    (Math.random() * 12 + 8) + "s");

  bubble.style.setProperty("--delay",
    (-Math.random() * 18) + "s");

  bubbleArea.appendChild(bubble);
}

// Subtle mouse interaction

const fish = document.getElementById("fish");
const hero = document.querySelector(".hero");

hero.addEventListener("mousemove", (event) => {
  if (window.innerWidth <= 700) return;

  const rect = hero.getBoundingClientRect();

  const x = (event.clientX - rect.left) / rect.width - 0.5;
  const y = (event.clientY - rect.top) / rect.height - 0.5;

  fish.style.marginLeft = `${x * 22}px`;
  fish.style.marginTop = `${y * 18}px`;
});

hero.addEventListener("mouseleave", () => {
  fish.style.marginLeft = "0";
  fish.style.marginTop = "0";
});
</script>
